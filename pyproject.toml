[project]
name = "s3f"
version = "0.1.0"
description = "fzf over a billion S3 objects — preview terabytes, download kilobytes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ejoliet" }]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "pyarrow>=15.0",
    "astropy>=6.0",
]

[project.scripts]
s3f = "s3f.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "moto[s3]>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pyarrow.*", "astropy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=s3f --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
